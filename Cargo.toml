[package]
name = "verizon_nle"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland"] }
egui = "0.36.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
ffmpeg-next = "9.0.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[patch.crates-io]
winit = { path = "vendor/winit" }

